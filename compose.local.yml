services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALBAM_MATE_LOCAL_DB_NAME:?ALBAM_MATE_LOCAL_DB_NAME must be set}
      POSTGRES_USER: ${ALBAM_MATE_LOCAL_DB_USER:?ALBAM_MATE_LOCAL_DB_USER must be set}
      POSTGRES_PASSWORD: ${ALBAM_MATE_LOCAL_DB_PASSWORD:?ALBAM_MATE_LOCAL_DB_PASSWORD must be set}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_DB_PORT:?ALBAM_MATE_LOCAL_DB_PORT must be set}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - albam_mate_postgres_data:/var/lib/postgresql

  spring:
    image: albam-mate-spring:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      ALBAM_MATE_LOCAL_DB_HOST: postgres
      ALBAM_MATE_LOCAL_DB_PORT: 5432
      ALBAM_MATE_LOCAL_DB_NAME: ${ALBAM_MATE_LOCAL_DB_NAME:?ALBAM_MATE_LOCAL_DB_NAME must be set}
      ALBAM_MATE_LOCAL_DB_USER: ${ALBAM_MATE_LOCAL_DB_USER:?ALBAM_MATE_LOCAL_DB_USER must be set}
      ALBAM_MATE_LOCAL_DB_PASSWORD: ${ALBAM_MATE_LOCAL_DB_PASSWORD:?ALBAM_MATE_LOCAL_DB_PASSWORD must be set}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_SPRING_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/api/games?size=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  vite:
    image: albam-mate-vite:local
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      spring:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  albam_mate_postgres_data:
