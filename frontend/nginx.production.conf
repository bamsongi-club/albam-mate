user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ops_timing escape=json
        '{"timestamp":"$time_iso8601",'
        '"event":"nginx_request_timing",'
        '"method":"$request_method",'
        '"routeGroup":"$albam_route_group",'
        '"status":"$status",'
        '"requestTimeSeconds":"$request_time",'
        '"upstreamResponseTimeSeconds":"$upstream_response_time",'
        '"upstreamAddress":"$upstream_addr"}';

    # 실제 URI·query·client 식별자를 남기지 않고 proxy 경계만 유한한 그룹으로 구분한다.
    map $uri $albam_route_group {
        default other;
        ~^/api/rooms/[1-9][0-9]*/chat/ws$ chat_websocket;
        ~^/api/ api;
        ~^/uploads/ uploads;
    }

    access_log off;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # App1 Compose Spring과 App2 private DNS를 하나의 upstream 그룹으로 묶는다.
    # ALBAM_MATE_APP2_HOST 는 App2 EC2의 private DNS 이름(예: app-b.albam-mate.internal)이다.
    # entrypoint에서 envsubst가 ALBAM_MATE_APP2_HOST 만 치환하고 Nginx 내장 변수는 유지한다.
    upstream spring_backend {
        server spring:8080;                   # App1 Compose Spring
        server ${ALBAM_MATE_APP2_HOST}:8080; # App2: envsubst로 실제 호스트 주소로 치환됨
    }

    server {
        listen 8080;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/albam-mate/tls/fullchain.pem;
        ssl_certificate_key /etc/albam-mate/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

        # WebSocket은 HTTP 응답이 없는 유휴 상태가 정상일 수 있으므로 일반 API timeout과 분리한다.
        location ~ ^/api/rooms/[1-9][0-9]*/chat/ws$ {
            access_log /dev/stdout ops_timing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://spring_backend;
        }

        location /api/ {
            access_log /dev/stdout ops_timing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass http://spring_backend;
        }

        location /uploads/ {
            access_log /dev/stdout ops_timing;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass http://spring_backend;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
