log_format albam_measurement '$time_iso8601 measurement_id=$http_x_albam_mate_measurement_id request="$request" status=$status upstream=$upstream_addr';
access_log /dev/stdout albam_measurement;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spring_upstream http://spring:8080;

    location /api/ {
        proxy_pass $spring_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Albam-Mate-Measurement-Id $http_x_albam_mate_measurement_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass_header X-Albam-Mate-Upstream;
        add_header X-Albam-Mate-Upstream-Address $upstream_addr always;
    }

    location /uploads/ {
        proxy_pass $spring_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header X-Albam-Mate-Upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
