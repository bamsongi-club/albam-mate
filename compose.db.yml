# DB EC2 전용: PostgreSQL 컨테이너만 실행한다.
# 보안 그룹(sg-postgres)에서 App1·App2 EC2(sg-app)에서 오는 TCP 5432만 허용한다.
# 데이터는 호스트의 /srv/postgresql 에 마운트된 EBS 볼륨에 저장한다.
# /etc/albam-mate/postgres.env 에 ALBAM_MATE_DB_NAME, ALBAM_MATE_DB_USER, ALBAM_MATE_DB_PASSWORD 를 설정한다.

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALBAM_MATE_DB_NAME:?ALBAM_MATE_DB_NAME must be set}
      POSTGRES_USER: ${ALBAM_MATE_DB_USER:?ALBAM_MATE_DB_USER must be set}
      POSTGRES_PASSWORD: ${ALBAM_MATE_DB_PASSWORD:?ALBAM_MATE_DB_PASSWORD must be set}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      # App1·App2 EC2에서 이 EC2의 사설 IP:5432 로 접근한다.
      # 보안 그룹에서 sg-app 만 허용하므로 0.0.0.0 바인딩이어도 인터넷에 노출되지 않는다.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      # /srv/postgresql 은 Terraform이 생성한 별도 EBS 볼륨 마운트 경로다.
      - /srv/postgresql:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: ${ALBAM_MATE_LOG_MAX_SIZE:-10m}
        max-file: ${ALBAM_MATE_LOG_MAX_FILES:-5}
