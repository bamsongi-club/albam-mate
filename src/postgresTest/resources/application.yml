spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    embedded-database-connection: none
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    locations: classpath:db/migration,classpath:db/vendor-migration/postgresql
