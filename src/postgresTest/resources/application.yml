spring:
  session:
    timeout: 30m
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    embedded-database-connection: none
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    locations: classpath:db/migration,classpath:db/vendor-migration/postgresql
app:
  room:
    status-correction:
      lock-name: room-status-correction
      trigger-delay: 15m
      trigger-jitter: 3m
      lock-at-most-for: 2m
      execution-warning-threshold: 30s
