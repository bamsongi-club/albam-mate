spring:
  config:
    activate:
      on-profile: local
  ai:
    openai:
      api-key: ${ALBAM_MATE_OPENAI_API_KEY:}
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${ALBAM_MATE_LOCAL_DB_HOST}:${ALBAM_MATE_LOCAL_DB_PORT}/${ALBAM_MATE_LOCAL_DB_NAME}
    username: ${ALBAM_MATE_LOCAL_DB_USER}
    password: ${ALBAM_MATE_LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor-migration/postgresql,classpath:db/local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  assistant:
    enabled: ${ALBAM_MATE_ASSISTANT_ENABLED:false}
    provider: ${ALBAM_MATE_ASSISTANT_PROVIDER:fake}
    no-retention-verified: ${ALBAM_MATE_ASSISTANT_NO_RETENTION_VERIFIED:false}
    no-training-verified: ${ALBAM_MATE_ASSISTANT_NO_TRAINING_VERIFIED:false}
  monitoring:
    upstream-role: ${ALBAM_MATE_ROLE:app1}
  security:
    cookie:
      secure: false
    auth-request:
      login-limit: ${ALBAM_MATE_LOGIN_LIMIT:30}
  chat:
    websocket:
      allowed-origin: ${ALBAM_MATE_CHAT_WEBSOCKET_ALLOWED_ORIGIN:http://localhost:5173}
  room:
    status-correction:
      lock-at-most-for: 2m
      execution-warning-threshold: 30s
  redis:
    host: ${ALBAM_MATE_LOCAL_REDIS_HOST}
    port: ${ALBAM_MATE_LOCAL_REDIS_PORT:6379}

server:
  forward-headers-strategy: framework
