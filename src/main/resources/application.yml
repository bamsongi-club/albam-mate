spring:
  application:
    name: albam-mate
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  notification:
    relay:
      enabled: true
      poll-interval: 5s
      max-events-per-run: 50
  security:
    password:
      bcrypt-cost: 10
    auth-request:
      window: 10m
      signup-limit: 5
      login-limit: 30
      login-failure-limit: 5
      max-ip-keys: 10000
      max-failure-keys: 10000
      hash-slots: 4
