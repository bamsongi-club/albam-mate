spring:
  application:
    name: albam-mate
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:

  chat:
    retention:
      enabled: true
      cron: "0 0 3 * * *"
      max-rooms-per-run: 50
      max-messages-per-run: 5000
      message-chunk-size: 100
      lock-at-most-for: 5s
      execution-warning-threshold: 1s

  notification:
    relay:
      enabled: true
      poll-interval: 5s
      max-events-per-run: 50
  security:
    password:
      bcrypt-cost: 10
    auth-request:
      window: 10m
      signup-limit: 5
      login-limit: 30
      login-failure-limit: 5
      max-ip-keys: 10000
      max-failure-keys: 10000
      hash-slots: 4
