spring:
  application:
    name: albam-mate
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  chat:
    retention:
      enabled: true
      cron: "0 0 3 * * *"
      max-rooms-per-run: 50
      max-messages-per-run: 5000
      message-chunk-size: 100
      lock-at-most-for: 5s
      lock-at-least-for: 5s
      execution-warning-threshold: 1s

  social:
    # Client ID와 Client Secret 두 값이 모두 있는 제공자만 활성화한다. 실제 값은 저장소에 두지 않고
    # 환경 변수로 주입하며, 주입하지 않은 제공자는 빈 값으로 남아 로그인 진입점에 노출되지 않는다.
    providers:
      google:
        client-id: ${ALBAM_MATE_GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${ALBAM_MATE_GOOGLE_OAUTH_CLIENT_SECRET:}
      naver:
        client-id: ${ALBAM_MATE_NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${ALBAM_MATE_NAVER_OAUTH_CLIENT_SECRET:}
      kakao:
        client-id: ${ALBAM_MATE_KAKAO_OAUTH_CLIENT_ID:}
        client-secret: ${ALBAM_MATE_KAKAO_OAUTH_CLIENT_SECRET:}
  notification:
    cleanup:
      interval: 1h
      jitter: 5m
      batch-size: 500
      max-batches-per-target: 5
    relay:
      enabled: true
      poll-interval: 5s
      max-events-per-run: 50
  security:
    password:
      bcrypt-cost: 10
    auth-request:
      window: 10m
      signup-limit: 5
      login-limit: 30
      login-failure-limit: 5
      max-ip-keys: 10000
      max-failure-keys: 10000
      hash-slots: 4
