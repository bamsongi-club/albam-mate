spring:
  config:
    activate:
      on-profile: local-multi
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${ALBAM_MATE_LOCAL_MULTI_DB_HOST}:${ALBAM_MATE_LOCAL_MULTI_DB_PORT}/${ALBAM_MATE_LOCAL_MULTI_DB_NAME}
    username: ${ALBAM_MATE_LOCAL_MULTI_DB_USER}
    password: ${ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor-migration/postgresql,classpath:db/local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    cookie:
      secure: false
  chat:
    websocket:
      allowed-origin: ${ALBAM_MATE_CHAT_WEBSOCKET_ALLOWED_ORIGIN:http://localhost:5174}
  room:
    status-correction:
      lock-at-most-for: 2m
      execution-warning-threshold: 30s
  redis:
    host: ${ALBAM_MATE_LOCAL_MULTI_REDIS_HOST}
    port: ${ALBAM_MATE_LOCAL_MULTI_REDIS_PORT:6379}
