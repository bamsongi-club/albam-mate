name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # 커버리지는 아래 합산 게이트로 판정하므로 test 전용 게이트는 제외한다. 제외하지
      # 않으면 build가 test 결과만으로 먼저 판정해, postgresTest가 담당하는 범위에
      # 의존하는 변경이 합산 판정에 닿기 전에 막힌다.
      - name: Build and verify
        run: ./gradlew build -x jacocoTestCoverageVerification --no-daemon --stacktrace

      - name: Verify local-multi runtime
        run: |
          docker compose --env-file .env.example -f compose.local-multi.yml config --quiet
          docker compose --env-file .env.example -f compose.local-multi.yml up -d --build --wait
          ./gradlew postgresTest --tests "cloud.bamsongi.albammate.global.security.session.LocalMultiProxyRuntimePostgresTest" -Dissue360.localMultiProxy=true --no-daemon --stacktrace

      - name: Stop local-multi runtime
        if: ${{ always() }}
        run: docker compose --env-file .env.example -f compose.local-multi.yml down

      # 두 Test 태스크가 모두 포함된 하나의 태스크 그래프에서 합산 커버리지를 판정한다.
      - name: Verify PostgreSQL schema and branch coverage
        run: ./gradlew postgresTest jacocoAllTestReport jacocoAllTestCoverageVerification --no-daemon --stacktrace

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content `
            -LiteralPath "build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml" `
            -Encoding UTF8 `
            -Raw
          $rows = @(
            foreach ($counterName in @("BRANCH", "LINE")) {
              $counter = $report.report.counter | Where-Object { $_.type -eq $counterName }
              $covered = [int]$counter.covered
              $total = $covered + [int]$counter.missed
              $ratio = if ($total -eq 0) { 100 } else { 100.0 * $covered / $total }
              "| $counterName | $covered | $total | $($ratio.ToString('F1'))% |"
            }
          )
          @(
            "## JaCoCo coverage"
            ""
            "| Counter | Covered | Total | Ratio |"
            "| --- | ---: | ---: | ---: |"
            $rows
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-coverage-${{ github.run_attempt }}
          path: |
            build/reports/jacoco/jacocoAllTestReport/html
            build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # 검사 스크립트는 의존성이 없으므로 러너 이미지의 Node.js를 그대로 사용한다.
      # 검사기 자체의 회귀 테스트를 먼저 실행해, 링크를 못 뽑는 검사기가 통과로 보이지 않게 한다.
      - name: Test document link checker
        run: node --test scripts/check-doc-links.test.mjs

      - name: Check document links
        run: node scripts/check-doc-links.mjs

      # 전달 게이트를 강제하는 검사기가 조용히 깨지면 게이트 없이 통과한 전달을 통과로 본다.
      # 검사기 자체의 회귀 테스트를 링크 검사와 같은 급으로 다룬다.
      - name: Test delivery gate validators
        run: >-
          node --test
          scripts/validate-packet.test.mjs
          scripts/validate-backend-test-manifest.test.mjs
          scripts/validate-coverage-ratchet.test.mjs
