name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # 커버리지는 아래 합산 게이트로 판정하므로 test 전용 게이트는 제외한다. 제외하지
      # 않으면 build가 test 결과만으로 먼저 판정해, postgresTest가 담당하는 범위에
      # 의존하는 변경이 합산 판정에 닿기 전에 막힌다.
      - name: Build and verify
        run: ./gradlew build -x jacocoTestCoverageVerification --no-daemon --stacktrace

      # 두 Test 태스크가 모두 포함된 하나의 태스크 그래프에서 합산 커버리지를 판정한다.
      - name: Verify PostgreSQL schema and branch coverage
        run: ./gradlew postgresTest jacocoAllTestReport jacocoAllTestCoverageVerification --no-daemon --stacktrace

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # 검사 스크립트는 의존성이 없으므로 러너 이미지의 Node.js를 그대로 사용한다.
      # 검사기 자체의 회귀 테스트를 먼저 실행해, 링크를 못 뽑는 검사기가 통과로 보이지 않게 한다.
      - name: Test document link checker
        run: node --test scripts/check-doc-links.test.mjs

      - name: Check document links
        run: node scripts/check-doc-links.mjs
