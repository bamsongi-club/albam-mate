name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            node scripts/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}"; then
            node scripts/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames "$base_sha" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/changed-paths.txt"
          node scripts/classify-ci-paths.mjs \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"

  backend-static:
    name: Backend Static
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Assemble and check conventions
        run: ./gradlew assemble conventionCheck --no-daemon --stacktrace

  local-runtime:
    name: Local Runtime
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Verify local runtime
        run: |
          docker compose --env-file .env.example -f compose.local.yml config --quiet
          docker compose --env-file .env.example -f compose.local.yml up -d --build --wait
          JAVA_TOOL_OPTIONS='-Dissue471.localProxy=true' ./gradlew postgresTest --tests "cloud.bamsongi.albammate.global.security.session.LocalMultiProxyRuntimePostgresTest" --rerun --fail-fast --no-daemon --stacktrace

      - name: Stop local runtime
        if: ${{ always() }}
        run: docker compose --env-file .env.example -f compose.local.yml down

  backend-coverage:
    name: Backend Coverage
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # H2와 PostgreSQL 실행 데이터를 한 태스크 그래프에서 한 번씩 생성해 합산한다.
      # 서로 다른 job으로 나누면 JaCoCo execution data 전달과 별도 병합 gate가 필요하다.
      - name: Test and verify PostgreSQL branch coverage
        run: >-
          ./gradlew
          test
          postgresTest
          jacocoAllTestReport
          jacocoAllTestCoverageVerification
          --no-daemon
          --stacktrace

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content `
            -LiteralPath "build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml" `
            -Encoding UTF8 `
            -Raw
          $rows = @(
            foreach ($counterName in @("BRANCH", "LINE")) {
              $counter = $report.report.counter | Where-Object { $_.type -eq $counterName }
              $covered = [int]$counter.covered
              $total = $covered + [int]$counter.missed
              $ratio = if ($total -eq 0) { 100 } else { 100.0 * $covered / $total }
              "| $counterName | $covered | $total | $($ratio.ToString('F1'))% |"
            }
          )
          @(
            "## JaCoCo coverage"
            ""
            "| Counter | Covered | Total | Ratio |"
            "| --- | ---: | ---: | ---: |"
            $rows
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-coverage-${{ github.run_attempt }}
          path: |
            build/reports/jacoco/jacocoAllTestReport/html
            build/reports/jacoco/jacocoAllTestReport/jacocoAllTestReport.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # 검사 스크립트는 의존성이 없으므로 러너 이미지의 Node.js를 그대로 사용한다.
      # 검사기 자체의 회귀 테스트를 먼저 실행해, 링크를 못 뽑는 검사기가 통과로 보이지 않게 한다.
      - name: Test document link checker
        run: node --test scripts/check-doc-links.test.mjs

      - name: Check document links
        run: node scripts/check-doc-links.mjs

      # 전달 게이트를 강제하는 검사기가 조용히 깨지면 게이트 없이 통과한 전달을 통과로 본다.
      # 검사기 자체의 회귀 테스트를 링크 검사와 같은 급으로 다룬다.
      - name: Test delivery gate validators
        run: >-
          node --test
          scripts/classify-ci-paths.test.mjs
          scripts/validate-packet.test.mjs
          scripts/validate-backend-test-manifest.test.mjs
          scripts/validate-coverage-ratchet.test.mjs

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - backend-static
      - local-runtime
      - backend-coverage
      - frontend
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_STATIC_RESULT: ${{ needs.backend-static.result }}
          LOCAL_RESULT: ${{ needs.local-runtime.result }}
          BACKEND_COVERAGE_RESULT: ${{ needs.backend-coverage.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          if [[ "$CHANGES_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            fail "Changes와 Docs는 항상 성공해야 합니다."
          fi

          if [[ "$BACKEND_REQUIRED" != "true" && "$BACKEND_REQUIRED" != "false" ]]; then
            fail "backend 경로 분류 결과가 없습니다."
          fi
          if [[ "$FRONTEND_REQUIRED" != "true" && "$FRONTEND_REQUIRED" != "false" ]]; then
            fail "frontend 경로 분류 결과가 없습니다."
          fi

          if [[ "$BACKEND_REQUIRED" == "true" ]]; then
            [[ "$BACKEND_STATIC_RESULT" == "success" ]] || fail "Backend Static이 실패했습니다."
            [[ "$LOCAL_RESULT" == "success" ]] || fail "Local Runtime이 실패했습니다."
            [[ "$BACKEND_COVERAGE_RESULT" == "success" ]] || fail "Backend Coverage가 실패했습니다."
          fi

          if [[ "$FRONTEND_REQUIRED" == "true" ]]; then
            [[ "$FRONTEND_RESULT" == "success" ]] || fail "Frontend가 실패했습니다."
          fi
