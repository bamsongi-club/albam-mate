name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      postgres_decision: ${{ steps.paths.outputs.postgres_decision }}
      postgres_required: ${{ steps.paths.outputs.postgres_required }}
      docker_required: ${{ steps.paths.outputs.docker_required }}
      base_sha: ${{ steps.paths.outputs.base_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/ci/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            target_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            target_sha="$GITHUB_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            node scripts/ci/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}"; then
            node scripts/ci/classify-ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames -z "$base_sha" "$target_sha" \
            > "$RUNNER_TEMP/changed-paths.txt"
          node scripts/ci/classify-ci-paths.mjs \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --base "$base_sha" \
            --worktree "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Summarize verification selection
        shell: bash
        env:
          BACKEND: ${{ steps.paths.outputs.backend }}
          FRONTEND: ${{ steps.paths.outputs.frontend }}
          POSTGRES_DECISION: ${{ steps.paths.outputs.postgres_decision }}
          POSTGRES_REQUIRED: ${{ steps.paths.outputs.postgres_required }}
          DOCKER_REQUIRED: ${{ steps.paths.outputs.docker_required }}
          POSTGRES_REASONS: ${{ steps.paths.outputs.postgres_reasons }}
        run: |
          {
            echo "## Verification selection"
            echo ""
            echo "| Scope | Result |"
            echo "| --- | --- |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| PostgreSQL decision | $POSTGRES_DECISION |"
            echo "| PostgreSQL jobs | $POSTGRES_REQUIRED |"
            echo "| Docker runtime | $DOCKER_REQUIRED |"
            echo "| Reasons | $POSTGRES_REASONS |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-fast:
    name: Backend Fast
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Assemble, test, and check conventions
        shell: bash
        env:
          POSTGRES_DECISION: ${{ needs.changes.outputs.postgres_decision }}
        run: |
          tasks=(assemble test conventionCheck)
          if [[ "$POSTGRES_DECISION" == "not-required" ]]; then
            tasks+=(jacocoTestReport verifyCoverageRuleTargets)
          fi
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace

      - name: Verify changed-package H2 coverage
        if: ${{ needs.changes.outputs.postgres_decision == 'not-required' }}
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: >-
          node scripts/verify-changed-h2-coverage.mjs
          --report build/reports/jacoco/test/jacocoTestReport.xml
          --worktree "$GITHUB_WORKSPACE"
          --base "$BASE_SHA"

      - name: Stage H2 coverage execution data
        shell: bash
        run: |
          test -s build/jacoco/test.exec
          mkdir -p build/ci-coverage
          cp build/jacoco/test.exec build/ci-coverage/test.exec

      - name: Upload H2 coverage execution data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-h2
          path: build/ci-coverage/test.exec
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload H2 test results
        if: ${{ always() && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: h2-test-results-${{ github.run_attempt }}
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: warn
          retention-days: 14

  local-runtime:
    name: Local Runtime
    needs: changes
    if: ${{ needs.changes.outputs.docker_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Verify local runtime
        run: |
          docker compose --env-file .env.example -f compose.local.yml config --quiet
          docker compose --env-file .env.example -f compose.local.yml up -d --build --wait
          JAVA_TOOL_OPTIONS='-Dissue471.localProxy=true' ./gradlew postgresTest --tests "cloud.bamsongi.albammate.global.security.session.LocalMultiProxyRuntimePostgresTest" --rerun --fail-fast --no-daemon --stacktrace

      - name: Stop local runtime
        if: ${{ always() }}
        run: docker compose --env-file .env.example -f compose.local.yml down

  backend-postgres:
    name: PostgreSQL ${{ matrix.label }}
    needs: changes
    if: ${{ needs.changes.outputs.postgres_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 0
            label: 1/3
          - index: 1
            label: 2/3
          - index: 2
            label: 3/3
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Test PostgreSQL shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          mapfile -t postgres_tests < <(
            node scripts/ci/partition-postgres-tests.mjs \
              --shard-count 3 \
              --shard-index "$SHARD_INDEX"
          )
          if (( ${#postgres_tests[@]} == 0 )); then
            echo "::error::PostgreSQL shard에 테스트가 없습니다."
            exit 1
          fi

          gradle_filters=()
          {
            echo "## PostgreSQL shard $((SHARD_INDEX + 1))/3"
            echo ""
            for test_class in "${postgres_tests[@]}"; do
              gradle_filters+=(--tests "$test_class")
              echo "- \`$test_class\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          ./gradlew postgresTest "${gradle_filters[@]}" --no-daemon --stacktrace

      - name: Stage PostgreSQL coverage execution data
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          test -s build/jacoco/postgresTest.exec
          mkdir -p build/ci-coverage
          cp build/jacoco/postgresTest.exec "build/ci-coverage/postgresTest-${SHARD_INDEX}.exec"

      - name: Upload PostgreSQL coverage execution data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-postgres-${{ matrix.index }}
          path: build/ci-coverage/postgresTest-${{ matrix.index }}.exec
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload PostgreSQL test results
        if: ${{ always() && hashFiles('build/test-results/postgresTest/*.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-test-results-${{ matrix.index }}-${{ github.run_attempt }}
          path: |
            build/test-results/postgresTest
            build/reports/tests/postgresTest
          if-no-files-found: warn
          retention-days: 14

  coverage-gate:
    name: Coverage Gate
    needs:
      - changes
      - backend-fast
      - backend-postgres
    if: ${{ always() && needs.changes.outputs.postgres_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC

    steps:
      - name: Verify coverage inputs
        shell: bash
        env:
          BACKEND_FAST_RESULT: ${{ needs.backend-fast.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres.result }}
        run: |
          if [[ "$BACKEND_FAST_RESULT" != "success" || "$POSTGRES_RESULT" != "success" ]]; then
            echo "::error::Coverage 입력 job이 성공하지 않았습니다."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Download H2 coverage execution data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-h2
          path: build/jacoco/merged

      - name: Download PostgreSQL coverage execution data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jacoco-postgres-*
          path: build/jacoco/merged
          merge-multiple: true

      - name: Verify merged branch coverage
        run: >-
          ./gradlew
          jacocoMergedTestReport
          jacocoMergedTestCoverageVerification
          --no-daemon
          --stacktrace

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoMergedTestReport/jacocoMergedTestReport.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content `
            -LiteralPath "build/reports/jacoco/jacocoMergedTestReport/jacocoMergedTestReport.xml" `
            -Encoding UTF8 `
            -Raw
          $rows = @(
            foreach ($counterName in @("BRANCH", "LINE")) {
              $counter = $report.report.counter | Where-Object { $_.type -eq $counterName }
              $covered = [int]$counter.covered
              $total = $covered + [int]$counter.missed
              $ratio = if ($total -eq 0) { 100 } else { 100.0 * $covered / $total }
              "| $counterName | $covered | $total | $($ratio.ToString('F1'))% |"
            }
          )
          @(
            "## JaCoCo coverage"
            ""
            "| Counter | Covered | Total | Ratio |"
            "| --- | ---: | ---: | ---: |"
            $rows
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ always() && hashFiles('build/reports/jacoco/jacocoMergedTestReport/jacocoMergedTestReport.xml') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-coverage-${{ github.run_attempt }}
          path: |
            build/reports/jacoco/jacocoMergedTestReport/html
            build/reports/jacoco/jacocoMergedTestReport/jacocoMergedTestReport.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # 검사 스크립트는 의존성이 없으므로 러너 이미지의 Node.js를 그대로 사용한다.
      # 검사기 자체의 회귀 테스트를 먼저 실행해, 링크를 못 뽑는 검사기가 통과로 보이지 않게 한다.
      - name: Test document link checker
        run: node --test scripts/docs/check-doc-links.test.mjs

      - name: Check document links
        run: node scripts/docs/check-doc-links.mjs

      # SEARCH-04 development seed·지표·품질 게이트의 회귀 경계를 CI에서 고정한다.
      - name: Test SEARCH-04 evaluation contracts
        run: node --test scripts/p2-search-evaluation.test.mjs

      - name: Check SEARCH-04 evaluation fixture
        run: node scripts/p2-search-evaluation.mjs --check --manifest docs/p2/search-evaluation/manifest.json

      - name: Check SEARCH-04 semantic-30 comparison manifest
        run: node scripts/search-evaluation/search-candidate-comparison.mjs --check --manifest docs/p2/search-evaluation/search-candidate-semantic-30-input.json

      - name: Check SEARCH-04 semantic-30 committed artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          packet_path="$artifact_dir/packet.json"
          metrics_path="$artifact_dir/metrics.json"
          trap 'rm -rf "$artifact_dir"' EXIT
          node scripts/search-evaluation/search-candidate-comparison.mjs \
            --packet \
            --manifest docs/p2/search-evaluation/search-candidate-semantic-30-input.json \
            --out "$packet_path" >/dev/null
          cmp -- "$packet_path" docs/p2/search-evaluation/search-candidate-comparison/semantic-30-human-judgement-packet.json
          node scripts/search-evaluation/search-candidate-comparison.mjs \
            --metrics \
            --hybrid-rrf \
            --manifest docs/p2/search-evaluation/search-candidate-semantic-30-input.json \
            --out "$metrics_path" >/dev/null
          cmp -- "$metrics_path" docs/p2/search-evaluation/search-candidate-comparison/semantic-30-metrics-pending.json

      - name: Test SEARCH-04 lexical sparse baseline
        run: node --test scripts/search-evaluation/lexical-sparse-baseline.test.mjs

      - name: Test SEARCH-04 Dense BGE-M3 contract
        run: python3 scripts/search-evaluation/run-bge-m3.test.py

      - name: Test SEARCH-04 candidate comparison
        run: node --test scripts/search-evaluation/search-candidate-comparison.test.mjs

      - name: Test SEARCH-04e live evidence contract
        run: node --test scripts/measurements/search-04e-hybrid-rrf-live.test.mjs

      - name: Check SEARCH-04e live evidence
        run: node scripts/measurements/search-04e-hybrid-rrf-live.mjs --validate docs/measurements/search-04e-hybrid-rrf-live.json

      - name: Test monitoring contract checker
        run: node --test scripts/docs/check-monitoring-contract.test.mjs

      - name: Check monitoring log contract
        run: node scripts/docs/check-monitoring-contract.mjs

      # ROOM k6 fixture·응답 계약은 의존성이 없는 Node 테스트로 CI에서도 반드시 검증한다.
      - name: Test ROOM k6 contracts
        run: >-
          node --test
          load-tests/k6/jiwon/tests/fixture-model.test.mjs
          load-tests/k6/jiwon/tests/room-mixed-options.test.mjs
          load-tests/k6/jiwon/tests/t3-execution-plan.test.mjs
          load-tests/k6/jiwon/tests/fixture-runner.test.mjs
          load-tests/k6/jiwon/tests/write-response-contract.test.mjs

      # 합성 summary로 검증할 수 없는 k6 1.3.0의 tagged submetric 동작도 실제 이미지로 회귀 검증한다.
      - name: Test ROOM k6 1.3.0 summary export
        run: node --test load-tests/k6/jiwon/tests/k6-summary-outcome-smoke.test.mjs

      # 계약 테스트가 import하지 않는 T1~T5 실행 스크립트도 병합 전 파싱한다.
      - name: Check ROOM k6 script syntax
        shell: bash
        run: |
          find load-tests/k6/jiwon -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -n 1 node --check

      # 전달 게이트를 강제하는 검사기가 조용히 깨지면 게이트 없이 통과한 전달을 통과로 본다.
      # 검사기 자체의 회귀 테스트를 링크 검사와 같은 급으로 다룬다.
      - name: Test delivery gate validators
        run: >-
          node --test
          scripts/ci/classify-ci-paths.test.mjs
          scripts/ci/classify-postgres-requirement.test.mjs
          scripts/ci/partition-postgres-tests.test.mjs
          scripts/ci/update-postgres-test-durations.test.mjs
          scripts/ci/validate-postgres-test-topology.test.mjs
          scripts/verify-changed-h2-coverage.test.mjs
          scripts/validate-packet.test.mjs
          scripts/validate-backend-test-manifest.test.mjs
          scripts/validate-coverage-ratchet.test.mjs
          scripts/measurements/room09-measurement-report.test.mjs
          scripts/measurements/match01-response-completion-report.test.mjs
          scripts/measurements/match01-candidate-baseline-report.test.mjs

      - name: Check PostgreSQL test topology
        run: node scripts/ci/validate-postgres-test-topology.mjs

      # 대형 측정 한 조합이 수십 분이라 파생물이 어긋나도 다시 측정해 맞출 수 없다.
      # 재현 명령·대비 표·SHA-256이 보존 원자료와 어긋나면 측정 없이 여기서 잡는다.
      - name: Check ROOM-09d measurement report
        run: node scripts/measurements/room09-measurement-report.mjs --check

      # MATCH-01 public artifact와 private sidecar의 digest·coverage·판정을 병합 전에 검증한다.
      - name: Check MATCH-01 response-completion measurement report
        run: >-
          node scripts/measurements/match01-response-completion-report.mjs --check
          docs/measurements/results/match-01/response-completion/response-completion-91d0fd9c8ccf51e073223e069aee5f98571ce228.json

      - name: Test game catalog contracts
        run: node --test scripts/game-catalog/*.test.mjs

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - backend-fast
      - local-runtime
      - backend-postgres
      - coverage-gate
      - frontend
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          POSTGRES_DECISION: ${{ needs.changes.outputs.postgres_decision }}
          POSTGRES_REQUIRED: ${{ needs.changes.outputs.postgres_required }}
          DOCKER_REQUIRED: ${{ needs.changes.outputs.docker_required }}
          BACKEND_FAST_RESULT: ${{ needs.backend-fast.result }}
          LOCAL_RESULT: ${{ needs.local-runtime.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          if [[ "$CHANGES_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            fail "Changes와 Docs는 항상 성공해야 합니다."
          fi

          if [[ "$BACKEND_REQUIRED" != "true" && "$BACKEND_REQUIRED" != "false" ]]; then
            fail "backend 경로 분류 결과가 없습니다."
          fi
          if [[ "$FRONTEND_REQUIRED" != "true" && "$FRONTEND_REQUIRED" != "false" ]]; then
            fail "frontend 경로 분류 결과가 없습니다."
          fi
          if [[ "$POSTGRES_REQUIRED" != "true" && "$POSTGRES_REQUIRED" != "false" ]]; then
            fail "PostgreSQL 필요 여부 분류 결과가 없습니다."
          fi
          if [[ "$DOCKER_REQUIRED" != "true" && "$DOCKER_REQUIRED" != "false" ]]; then
            fail "Docker 필요 여부 분류 결과가 없습니다."
          fi
          if [[ "$POSTGRES_DECISION" != "required" && "$POSTGRES_DECISION" != "not-required" && "$POSTGRES_DECISION" != "needs-review" ]]; then
            fail "PostgreSQL 분류 결정이 올바르지 않습니다."
          fi
          if [[ "$POSTGRES_REQUIRED" == "true" && "$DOCKER_REQUIRED" != "true" ]]; then
            fail "PostgreSQL 검증이 필요한데 Docker runtime이 생략되었습니다."
          fi

          if [[ "$BACKEND_REQUIRED" == "true" ]]; then
            [[ "$BACKEND_FAST_RESULT" == "success" ]] || fail "Backend Fast가 실패했습니다."
            if [[ "$DOCKER_REQUIRED" == "true" ]]; then
              [[ "$LOCAL_RESULT" == "success" ]] || fail "Local Runtime이 실패했습니다."
            else
              [[ "$LOCAL_RESULT" == "skipped" ]] || fail "불필요한 Local Runtime이 실행되었습니다."
            fi
            if [[ "$POSTGRES_REQUIRED" == "true" ]]; then
              [[ "$POSTGRES_RESULT" == "success" ]] || fail "PostgreSQL shard가 실패했습니다."
              [[ "$COVERAGE_RESULT" == "success" ]] || fail "Coverage Gate가 실패했습니다."
            else
              [[ "$POSTGRES_RESULT" == "skipped" ]] || fail "불필요한 PostgreSQL shard가 실행되었습니다."
              [[ "$COVERAGE_RESULT" == "skipped" ]] || fail "불필요한 합산 Coverage Gate가 실행되었습니다."
            fi
          fi

          if [[ "$FRONTEND_REQUIRED" == "true" ]]; then
            [[ "$FRONTEND_RESULT" == "success" ]] || fail "Frontend가 실패했습니다."
          fi
