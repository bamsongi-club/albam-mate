name: P2 CD trigger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  source-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      ci_url: ${{ steps.source.outputs.ci_url }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        with:
          script: |
            const source = context.payload.workflow_run;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'develop',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const hasNewerSuccessfulRun = runs.some((run) =>
              run.conclusion === 'success' &&
              run.run_number > source.run_number &&
              run.head_repository?.full_name === context.payload.repository.full_name);
            if (hasNewerSuccessfulRun) {
              core.setFailed('higher successful develop push CI run exists');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA ?? '')) {
              core.setFailed('workflow_run head SHA is invalid');
              return;
            }
            core.setOutput('source_sha', process.env.SOURCE_SHA);
            core.setOutput('ci_url', source.html_url);

  invoke-p2-cd:
    needs: source-gate
    if: vars.P2_CD_ENABLED == 'true'
    uses: bamsongi-club/albam-mate/.github/workflows/p2-cd.yml@develop
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      source_sha: ${{ needs.source-gate.outputs.source_sha }}
      ci_url: ${{ needs.source-gate.outputs.ci_url }}
