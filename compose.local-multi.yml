services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALBAM_MATE_LOCAL_MULTI_DB_NAME:?ALBAM_MATE_LOCAL_MULTI_DB_NAME must be set}
      POSTGRES_USER: ${ALBAM_MATE_LOCAL_MULTI_DB_USER:?ALBAM_MATE_LOCAL_MULTI_DB_USER must be set}
      POSTGRES_PASSWORD: ${ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD:?ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD must be set}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_MULTI_DB_PORT:?ALBAM_MATE_LOCAL_MULTI_DB_PORT must be set}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - albam_mate_local_multi_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_MULTI_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  spring-1:
    image: albam-mate-spring:local-multi
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &spring_environment
      SPRING_PROFILES_ACTIVE: local-multi
      ALBAM_MATE_LOCAL_MULTI_DB_HOST: postgres
      ALBAM_MATE_LOCAL_MULTI_DB_PORT: 5432
      ALBAM_MATE_LOCAL_MULTI_DB_NAME: ${ALBAM_MATE_LOCAL_MULTI_DB_NAME:?ALBAM_MATE_LOCAL_MULTI_DB_NAME must be set}
      ALBAM_MATE_LOCAL_MULTI_DB_USER: ${ALBAM_MATE_LOCAL_MULTI_DB_USER:?ALBAM_MATE_LOCAL_MULTI_DB_USER must be set}
      ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD: ${ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD:?ALBAM_MATE_LOCAL_MULTI_DB_PASSWORD must be set}
      ALBAM_MATE_LOCAL_MULTI_REDIS_HOST: redis
      ALBAM_MATE_LOCAL_MULTI_REDIS_PORT: 6379
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &spring_healthcheck
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/api/games?size=1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  spring-2:
    image: albam-mate-spring:local-multi
    restart: unless-stopped
    environment: *spring_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *spring_healthcheck

  proxy:
    image: albam-mate-vite:local-multi
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      spring-1:
        condition: service_healthy
      spring-2:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALBAM_MATE_LOCAL_MULTI_PROXY_PORT:-5174}:80"
    volumes:
      - ./frontend/nginx.local-multi.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  albam_mate_local_multi_postgres_data:
