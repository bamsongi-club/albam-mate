plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'checkstyle'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'cloud.bamsongi'
version = '0.0.1-SNAPSHOT'
description = 'albam-mate'

// Spring Boot 4.1.0 BOM보다 먼저 공개된 보안 패치 버전을 사용한다.
// 이후 BOM이 아래 버전 이상을 관리하면 이 override를 제거한다.
ext['postgresql.version'] = '42.7.12'
ext['jackson-bom.version'] = '3.1.5'
ext['netty.version'] = '4.2.16.Final'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

checkstyle {
    toolVersion = '13.8.0'
    configDirectory = file('config/checkstyle')
    maxWarnings = 0
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.spring.io/milestone') }
}

sourceSets {
    postgresTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }

    // 파일 동기화 도구가 만드는 'Foo 2.java' 사본은 .gitignore가 이미 걸러내지만 컴파일러는 그대로 읽어
    // "class Foo is public, should be declared in Foo.java"로 빌드를 깨뜨린다. 같은 패턴을 여기서도 제외한다.
    all {
        java.exclude { it.name ==~ /.+ \d+\.java/ }
    }
}

configurations {
    postgresTestImplementation.extendsFrom testImplementation
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'io.micrometer:micrometer-registry-otlp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-openai:2.0.0-M7'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.7.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit:1.4.2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    postgresTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    postgresTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    postgresTestImplementation 'org.testcontainers:testcontainers-postgresql'
	postgresTestImplementation 'io.opentelemetry.proto:opentelemetry-proto:1.10.0-alpha'
    postgresTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('postgresTest', Test) {
    description = 'Runs PostgreSQL integration tests with Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.postgresTest.output.classesDirs
    classpath = sourceSets.postgresTest.runtimeClasspath
    dependsOn tasks.named('postgresTestClasses')
    shouldRunAfter tasks.named('test')
    useJUnitPlatform {
        excludeTags 'measurement'
    }
}

tasks.register('postgresMeasurementTest', Test) {
    description = 'Runs opt-in PostgreSQL wall-clock and baseline/candidate measurements.'
    group = 'verification'
    testClassesDirs = sourceSets.postgresTest.output.classesDirs
    classpath = sourceSets.postgresTest.runtimeClasspath
    dependsOn tasks.named('postgresTestClasses')
    shouldRunAfter tasks.named('postgresTest')
    useJUnitPlatform {
        includeTags 'measurement'
    }
}

pitest {
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'cloud.bamsongi.albammate.global.security.ratelimit.InMemoryAuthenticationRequestLimiter',
        'cloud.bamsongi.albammate.notification.recovery.NotificationOutboxRecoveryPolicy',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionCandidateSelector',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionCoordinator',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionExecutor'
    ]
    targetTests = [
        'cloud.bamsongi.albammate.global.security.ratelimit.InMemoryAuthenticationRequestLimiterTest',
        'cloud.bamsongi.albammate.notification.recovery.NotificationOutboxRecoveryPolicyTest',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionCandidateSelectorTest',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionCoordinatorTest',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionBoundedCoordinatorTest',
        'cloud.bamsongi.albammate.room.statuscorrection.RoomStatusCorrectionExecutorTest'
    ]
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    threads = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    useClasspathFile = true
    failWhenNoMutations = true
}

tasks.register('highRiskMutationTest') {
    description = 'Runs opt-in PIT mutation tests for high-risk deterministic policies.'
    group = 'verification'
    dependsOn tasks.named('pitest')
}

// 커버리지 태스크는 담당 Test 태스크의 execution data만 명시적으로 사용한다.
// build/jacoco/*.exec 전체를 읽으면 이번 실행에서 돌리지 않은 suite의 이전 exec가 남아
// 함께 집계되고, 테스트를 바꾸거나 지워도 과거 실행 데이터가 분기를 덮어 거짓 통과한다.
def testExecutionData = layout.buildDirectory.file('jacoco/test.exec')
def postgresTestExecutionData = layout.buildDirectory.file('jacoco/postgresTest.exec')
def mergedExecutionDataDirectory = layout.buildDirectory.dir('jacoco/merged')
def mergedExecutionDataNames = ['test.exec', 'postgresTest-0.exec', 'postgresTest-1.exec', 'postgresTest-2.exec']
def mergedExecutionData = files(mergedExecutionDataNames.collect { fileName ->
    mergedExecutionDataDirectory.map { directory -> directory.file(fileName) }
})

def verifyExecutionData = { executionData, expectedNames ->
    def filesByName = executionData.files.collectEntries { executionDataFile ->
        [(executionDataFile.name): executionDataFile]
    }
    def missing = expectedNames.findAll { fileName ->
        def executionDataFile = filesByName[fileName]
        executionDataFile == null || !executionDataFile.isFile() || executionDataFile.length() == 0
    }
    if (!missing.isEmpty()) {
        throw new GradleException("합산할 JaCoCo execution data가 없거나 비어 있습니다: ${missing.join(', ')}")
    }
}

// H2 test만 집계한다. Docker 없이 실행할 수 있는 빠른 리포트다.
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    executionData.setFrom(testExecutionData)
    reports {
        xml.required = true
        html.required = true
    }
}

// test와 postgresTest를 함께 집계한다. 두 Test 태스크가 이번 실행에서 모두 갱신된 뒤
// 검사되도록 둘에 의존한다.
tasks.register('jacocoAllTestReport', JacocoReport) {
    description = 'Generates a coverage report from both test and postgresTest.'
    group = 'verification'
    dependsOn tasks.named('test'), tasks.named('postgresTest')
    sourceSets sourceSets.main
    executionData.setFrom(testExecutionData, postgresTestExecutionData)
    reports {
        xml.required = true
        html.required = true
    }
}

// CI의 독립 runner에서 생성한 H2와 PostgreSQL shard execution data를 합산한다.
// Test 태스크에 의존하지 않아 coverage gate runner에서 테스트를 다시 실행하지 않는다.
tasks.register('jacocoMergedTestReport', JacocoReport) {
    description = 'Generates a coverage report from CI-sharded test execution data.'
    group = 'verification'
    dependsOn tasks.named('classes')
    sourceSets sourceSets.main
    executionData.setFrom(mergedExecutionData)
    reports {
        xml.required = true
        html.required = true
    }
    doFirst {
        verifyExecutionData(mergedExecutionData, mergedExecutionDataNames)
    }
}

// 분기 커버리지 최소선은 도입 시점의 실측값을 0.01 단위로 내림한 래칫이다.
// 목표치가 아니므로 올릴 때만 값을 바꾸고, 낮추려면 이유를 PR에 남긴다.
// 분기 수가 coveragePackageRuleMinimumBranches 미만인 패키지는 분기 하나에 비율이 크게
// 흔들려 개별 규칙을 두지 않고 전체 최소선으로만 관리한다.
def coveragePackageRuleMinimumBranches = 10
def gatedBranchCoverage = [
    'cloud.bamsongi.albammate.auth.dto'       : 0.67,
    'cloud.bamsongi.albammate.auth.security'  : 0.94,
    'cloud.bamsongi.albammate.auth.service'   : 0.80,
    'cloud.bamsongi.albammate.auth.social'    : 0.89,
    'cloud.bamsongi.albammate.auth.validation': 0.85,
    'cloud.bamsongi.albammate.chat.match'         : 0.84,
    'cloud.bamsongi.albammate.chat.match.service' : 0.92,
    'cloud.bamsongi.albammate.chat.retention' : 0.56,
    'cloud.bamsongi.albammate.chat.service'   : 0.92,
    'cloud.bamsongi.albammate.chat.system'    : 0.90,
    'cloud.bamsongi.albammate.chat.websocket' : 0.62,
    'cloud.bamsongi.albammate.game.dto'       : 1.00,
    'cloud.bamsongi.albammate.game.service'   : 1.00,
    'cloud.bamsongi.albammate.game.repository': 0.91,
    'cloud.bamsongi.albammate.global.config'               : 1.00,
    'cloud.bamsongi.albammate.global.exception'            : 0.89,
    'cloud.bamsongi.albammate.global.security.currentuser' : 0.83,
    'cloud.bamsongi.albammate.global.security.endpoint'    : 0.90,
    'cloud.bamsongi.albammate.global.security.error'       : 0.71,
    'cloud.bamsongi.albammate.global.security.ratelimit'   : 0.84,
    'cloud.bamsongi.albammate.assistant.dto'                : 0.57,
	'cloud.bamsongi.albammate.assistant.entity'             : 0.80,
    'cloud.bamsongi.albammate.assistant.service'            : 0.50,
    'cloud.bamsongi.albammate.infra.ai'                     : 0.49,
    'cloud.bamsongi.albammate.infra.redis'                  : 0.73,
    'cloud.bamsongi.albammate.matching.recovery'            : 0.55,
    'cloud.bamsongi.albammate.matching.service.command'     : 0.75,
    'cloud.bamsongi.albammate.monitoring'                   : 0.75,
    'cloud.bamsongi.albammate.matching.service.query'       : 0.36,
    'cloud.bamsongi.albammate.notification.cleanup'        : 1.00,
    'cloud.bamsongi.albammate.notification.dto'            : 0.77,
    'cloud.bamsongi.albammate.notification.repository'     : 0.50,
    'cloud.bamsongi.albammate.notification.recovery'       : 0.70,
    'cloud.bamsongi.albammate.notification.relay'          : 0.84,
    'cloud.bamsongi.albammate.room.enums'                  : 0.80,
    'cloud.bamsongi.albammate.room.entity'    : 0.91,
    'cloud.bamsongi.albammate.room.controller': 0.92,
    'cloud.bamsongi.albammate.room.dto'       : 0.92,
    'cloud.bamsongi.albammate.room.service'   : 0.90,
    'cloud.bamsongi.albammate.room.service.command'  : 0.91,
    'cloud.bamsongi.albammate.room.service.query'    : 0.94,
    'cloud.bamsongi.albammate.room.statuscorrection' : 0.82,
    'cloud.bamsongi.albammate.user.contract'  : 0.92,
    'cloud.bamsongi.albammate.user.service'   : 0.71,
]

def applyCoverageRules = { JacocoCoverageVerification verification ->
    verification.violationRules { rules ->
        rules.rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.72
            }
            // 분기 커버리지는 조건문이 없는 코드를 세지 않는다. 조건문 없는 서비스·매핑 코드가
            // 테스트 없이 들어오면 분기 규칙은 아무 반응을 하지 않으므로 전체 라인 최소선을
            // 함께 둔다. 패키지 단위로는 두지 않는다. 루트 패키지는 애플리케이션 진입점만
            // 있어 라인 비율이 구조적으로 낮다.
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.92
            }
        }
        gatedBranchCoverage.each { packageName, packageMinimum ->
            rules.rule {
                element = 'PACKAGE'
                includes = [packageName]
                limit {
                    counter = 'BRANCH'
                    value = 'COVEREDRATIO'
                    minimum = packageMinimum
                }
            }
        }
    }
}

// check에 포함되는 빠른 게이트다. H2 test 결과만 보므로 Docker를 요구하지 않는다.
// 규칙 대상 검사에 의존해, 게이트를 단독으로 실행해도 최소선 목록과 패키지 구조가
// 어긋난 상태를 놓치지 않게 한다.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test'), tasks.named('verifyCoverageRuleTargets')
    executionData.setFrom(testExecutionData)
    applyCoverageRules(it)
}

// 정본 게이트다. PostgreSQL 통합 테스트가 담당하는 범위까지 합쳐 판정한다.
// CI는 이 태스크로 판정하고, 선행 test 전용 게이트가 판정을 가로막지 않도록 제외한다.
tasks.register('jacocoAllTestCoverageVerification', JacocoCoverageVerification) {
    description = 'Verifies branch coverage from both test and postgresTest.'
    group = 'verification'
    dependsOn tasks.named('test'), tasks.named('postgresTest'),
            tasks.named('verifyCoverageRuleTargets'), tasks.named('jacocoAllTestReport')
    sourceSets sourceSets.main
    executionData.setFrom(testExecutionData, postgresTestExecutionData)
    applyCoverageRules(it)
}

// CI shard가 만든 execution data만 사용하는 정본 게이트다. shard 누락을 먼저 검사하고
// 합산 리포트의 실제 패키지 구조와 커버리지 최소선을 함께 판정한다.
tasks.register('jacocoMergedTestCoverageVerification', JacocoCoverageVerification) {
    description = 'Verifies branch coverage from CI-sharded test execution data.'
    group = 'verification'
    dependsOn tasks.named('classes'), tasks.named('jacocoMergedTestReport'),
            tasks.named('verifyMergedCoverageRuleTargets')
    sourceSets sourceSets.main
    executionData.setFrom(mergedExecutionData)
    applyCoverageRules(it)
    doFirst {
        verifyExecutionData(mergedExecutionData, mergedExecutionDataNames)
    }
}

// 패키지 규칙은 이름이 정확히 일치할 때만 적용되고, 규칙이 없는 패키지는 전체 최소선만
// 적용된다. 전체 최소선은 새 분기가 분모를 함께 키우므로 새 모듈이 낮은 커버리지로
// 들어와도 통과할 수 있다. 두 방향을 모두 실패로 만들어 대상 목록이 실제 패키지 구조와
// 어긋난 채 검사가 약해지지 않게 한다.
def coverageReportXmlFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
def mergedCoverageReportXmlFile =
        layout.buildDirectory.file('reports/jacoco/jacocoMergedTestReport/jacocoMergedTestReport.xml')

def registerCoverageRuleTargetVerification = { taskName, reportTaskName, reportFile ->
    tasks.register(taskName) {
        description = 'Fails when coverage rule targets and the reported packages disagree.'
        group = 'verification'
        dependsOn tasks.named(reportTaskName)
        inputs.file(reportFile)
        def ruleTargets = gatedBranchCoverage.keySet()
        def minimumBranches = coveragePackageRuleMinimumBranches
        doLast {
            def parser = new groovy.xml.XmlSlurper()
            parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', false)
            parser.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)

            def branchesByPackage = [:]
            parser.parse(reportFile.get().asFile).'package'.each { reportedPackage ->
                def covered = 0
                def missed = 0
                reportedPackage.counter.each { counter ->
                    if (counter.@type.text() == 'BRANCH') {
                        covered = counter.@covered.text() as int
                        missed = counter.@missed.text() as int
                    }
                }
                branchesByPackage[reportedPackage.@name.text().replace('/', '.')] =
                        [covered: covered, total: covered + missed]
            }

            def problems = []
            ruleTargets.findAll { !branchesByPackage.containsKey(it) }.sort().each { target ->
                problems << "규칙 대상 패키지가 리포트에 없습니다: ${target}"
            }
            branchesByPackage
                    .findAll { name, branches -> branches.total >= minimumBranches && !ruleTargets.contains(name) }
                    .keySet()
                    .sort()
                    .each { name ->
                        def branches = branchesByPackage[name]
                        problems << String.format(
                                '최소선이 없는 패키지가 있습니다: %s (분기 %d개, 현재 %.1f%%)',
                                name, branches.total, branches.covered * 100.0 / branches.total)
                    }

            if (!problems.isEmpty()) {
                throw new GradleException((['커버리지 규칙 대상이 현재 패키지 구조와 맞지 않습니다.']
                        + problems
                        + ["분기 ${minimumBranches}개 이상인 패키지는 build.gradle 의 gatedBranchCoverage 에"
                                 + ' 최소선을 두어야 합니다. 실측값을 0.01 단위로 내려 적으세요.'])
                        .join('\n - '))
            }
        }
    }
}

registerCoverageRuleTargetVerification(
        'verifyCoverageRuleTargets', 'jacocoTestReport', coverageReportXmlFile)
registerCoverageRuleTargetVerification(
        'verifyMergedCoverageRuleTargets', 'jacocoMergedTestReport', mergedCoverageReportXmlFile)

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('verifyCoverageRuleTargets')
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'user.timezone', 'UTC'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
}

// 개발 셸의 SPRING_DATASOURCE_* 값이 테스트 경계를 흐리지 않도록 두 Test 태스크에
// 의도적으로 도달시킨다. H2 test는 시스템 속성으로 이를 이겨야 하고, postgresTest는
// @ServiceConnection이 Testcontainers 연결을 우선해야 한다.
def ambientDataSource = [
    url     : 'jdbc:postgresql://127.0.0.1:65432/ambient',
    username: 'ambient',
    password: 'ambient',
]

tasks.named('test', Test) {
    environment 'SPRING_DATASOURCE_URL', ambientDataSource.url
    environment 'SPRING_DATASOURCE_USERNAME', ambientDataSource.username
    environment 'SPRING_DATASOURCE_PASSWORD', ambientDataSource.password

    systemProperty 'spring.datasource.url',
            'jdbc:h2:mem:albam-mate-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1'
    systemProperty 'spring.datasource.username', 'sa'
    systemProperty 'spring.datasource.password', ''
    systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
}

tasks.named('postgresTest', Test) {
    environment 'SPRING_DATASOURCE_URL', ambientDataSource.url
    environment 'SPRING_DATASOURCE_USERNAME', ambientDataSource.username
    environment 'SPRING_DATASOURCE_PASSWORD', ambientDataSource.password

    systemProperty 'issue360.localMultiProxy',
            System.getProperty('issue360.localMultiProxy', 'false')
}

spotless {
    java {
        eclipse().configFile('config/formatter/naver-eclipse-formatter.xml')
        importOrderFile('config/formatter/naver.importorder')
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('conventionCheck') {
    group = 'verification'
    description = 'Spotless와 모든 Java source set의 Checkstyle 규칙을 검사한다.'
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.withType(Checkstyle)
}
