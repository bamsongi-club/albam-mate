plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
}

group = 'cloud.bamsongi'
version = '0.0.1-SNAPSHOT'
description = 'albam-mate'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    postgresTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    postgresTestImplementation.extendsFrom testImplementation
    postgresTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    postgresTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    postgresTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    postgresTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.register('postgresTest', Test) {
    description = 'Runs PostgreSQL integration tests with Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.postgresTest.output.classesDirs
    classpath = sourceSets.postgresTest.runtimeClasspath
    dependsOn tasks.named('postgresTestClasses')
    shouldRunAfter tasks.named('test')
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'user.timezone', 'UTC'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
}

spotless {
    java {
        googleJavaFormat('1.35.0').aosp()
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
